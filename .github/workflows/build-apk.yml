name: Build Android APK

on:
  push:
    branches: [ main, master ] # আপনার মেইন ব্রাঞ্চের নাম অনুযায়ী
  workflow_dispatch: # ম্যানুয়ালি ক্লিক করে বিল্ড করার অনুমতি দেয়

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets
        run: npm run build

      - name: Add and Sync Android Platform
        run: |
          npx cap init "VocabApp" "com.vocab.app" --web-dir dist
          npx cap add android
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VocabApp-Debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
