name: Build Android APK

on:
  push:
    branches:
      - main # আপনার রিপোজিটরির মেইন ব্রাঞ্চের নাম (main বা master)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Dependencies & Setup Capacitor
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init MyApp com.myapp.app --web-dir=dist
          npx cap add android

      - name: Build Web App
        run: npm run build

      - name: Sync with Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyApp-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
